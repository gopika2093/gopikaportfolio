<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="referrer" content="no-referrer"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><title>Brainer · One thing at a time</title><link rel="stylesheet" href="./style.css"></head><body><div id="brainer-calm-preview">
  
  <div class="th-app">
    <header class="th-top">
      <div class="th-brand"><span class="th-brand-mark"><i data-lucide="brain-circuit" aria-hidden="true"></i></span><div><span class="th-brand-word">Brainer</span><small>Gopika’s thinking practice</small></div></div>
      <div class="th-top-right"><small class="th-preview" id="cloud-status" role="status">Connect to save</small><button type="button" class="th-link cursor-interaction" data-action="focus" aria-pressed="false"><i data-lucide="scan" aria-hidden="true"></i><span>Focus view</span></button></div>
    </header>
    <div id="brainer-account" class="br-account"></div><div class="th-shell">
      <aside class="th-sidebar">
        <nav class="th-nav" aria-label="Main navigation">
          <button type="button" class="cursor-interaction" data-nav="today" aria-current="page"><i data-lucide="sun" aria-hidden="true"></i>Today</button>
          <button type="button" class="cursor-interaction" data-nav="progress"><i data-lucide="chart-no-axes-combined" aria-hidden="true"></i>My progress</button>
          <button type="button" class="cursor-interaction" data-nav="settings"><i data-lucide="sliders-horizontal" aria-hidden="true"></i>Settings</button>
        </nav>
        
      </aside>
      <main class="th-main" id="brainer-content" aria-label="Thinking practice"></main>
    </div>
  </div>
  
</div>
<script src="./config.js"></script><script src="./app.js"></script></body></html>
